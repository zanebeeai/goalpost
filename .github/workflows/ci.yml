name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      # No env on purpose: public pages must build and render without Supabase.
      - run: pnpm build

  stack:
    name: Database and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      # Keeps the mail catcher: e2e signs up through the real confirmation email.
      - run: pnpm exec supabase start -x studio,postgres-meta
      - run: pnpm db:test
      - run: pnpm env:local
      - run: pnpm exec playwright install --with-deps chromium
      # Builds and starts the production server against the local stack.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - if: always()
        run: pnpm exec supabase stop --no-backup
